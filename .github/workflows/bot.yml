name: "CONFIG COLLECTOR"

on:
  workflow_dispatch:
  schedule:
    - cron: '*/60 * * * *'
    
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: curl, mbstring
          
      - name: 🧹 Полная очистка перед запуском (убираем конфликты)
        run: |
          git rm -rf --quiet sub/ || true
          mkdir -p sub
      
      - name: Execute PHP script
        run: |
          php bot.php
      
      - name: Configure Git (ТВОЙ РЕПОЗИТОРИЙ, НЕ ОРИГИНАЛ!)
        run: |
          git config --global user.email "vip.mahditaheri@gmail.com"
          git config --global user.name "MhdiTaheri"
          # 👇 ВАЖНО: пушим ТВОЙ репозиторий, не оригинал!
          git remote set-url origin https://github.com/PENZA84/V2rayCollector-.git
      
      - name: Push changes (без rebase, чтобы не было конфликтов)
        run: |
          git add -A
          git commit -m "V0.2 🚀 - $(TZ='Asia/Tehran' date '+%Y-%m-%d %H:%M:%S')" || echo "ℹ️ Нет изменений"
          git push origin main --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
